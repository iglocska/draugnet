<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draugnet – Report via Template</title>

  <link href="css/fontawesome.all.min.css" rel="stylesheet" />
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />

  <script src="js/main.js"       defer></script>
  <script src="js/tokenstore.js" defer></script>
  <script src="js/menu.js"       defer></script>

  <style>
    /* ── Template picker combobox (shared idiom with object.html) ──── */
    .tmpl-combobox { position: relative; }

    .tmpl-combobox-wrap {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: .375rem;
      padding: 0 .75rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .tmpl-combobox-wrap:focus-within {
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 .2rem rgba(var(--bs-primary-rgb), .15);
    }
    .tmpl-combobox-wrap .fa-magnifying-glass {
      color: var(--placeholder);
      font-size: .8rem;
      flex-shrink: 0;
    }
    #template-select {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: .5rem 0;
      font-size: .875rem;
      color: var(--app-fg);
      min-width: 0;
    }
    #template-select::placeholder { color: var(--placeholder); }

    .tmpl-clear {
      background: none;
      border: none;
      padding: .15rem .1rem;
      color: var(--placeholder);
      cursor: pointer;
      font-size: .75rem;
      line-height: 1;
      flex-shrink: 0;
      display: none;
    }
    .tmpl-clear:hover { color: var(--app-fg); }

    .tmpl-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 300;
      background: var(--sidebar-bg);
      border: 1px solid var(--card-border);
      border-radius: .4rem;
      box-shadow: 0 6px 24px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .tmpl-list {
      max-height: 320px;
      overflow-y: auto;
      padding: .3rem 0;
    }
    .tmpl-item {
      padding: .45rem .85rem;
      font-size: .82rem;
      color: var(--bs-secondary-color);
      cursor: pointer;
      transition: background .08s, color .08s;
    }
    .tmpl-item .tmpl-item-name {
      color: var(--app-fg);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tmpl-item .tmpl-item-desc {
      font-size: .74rem;
      color: var(--bs-secondary-color);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tmpl-item:hover,
    .tmpl-item.tmpl-focused {
      background: var(--hover-bg);
    }
    .tmpl-item mark {
      background: rgba(var(--bs-warning-rgb), .25);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    .tmpl-empty {
      padding: .75rem .85rem;
      font-size: .82rem;
      color: var(--placeholder);
      text-align: center;
    }

    /* ── Template info banner — visible once a template is loaded ──── */
    #template-header:not(:empty) {
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--bs-info);
      border-radius: .5rem;
      padding: .7rem 1rem;
      margin-bottom: 1rem;
    }
    #template-header h3 {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: .15rem;
    }
    #template-header p {
      font-size: .85rem;
      color: var(--bs-secondary-color);
      margin-bottom: .35rem;
    }
    #template-header .tmpl-tag {
      display: inline-block;
      font-size: .7rem;
      padding: .1rem .45rem;
      margin: 0 .25rem .2rem 0;
      border-radius: 1rem;
      background: var(--hover-bg);
      color: var(--bs-secondary-color);
    }

    /* ── Dynamic form ─────────────────────────────────────────────── */
    #report-form .btn-primary { margin-top: .5rem; }
    #report-form .form-label { font-size: .82rem; font-weight: 600; }
    #report-form .form-text { font-size: .74rem; }
    #report-form .form-text code,
    .tmpl-textblock code {
      background: var(--hover-bg);
      padding: .05rem .3rem;
      border-radius: .2rem;
      font-size: .92em;
    }

    /* text_block prose */
    .tmpl-textblock {
      font-size: .82rem;
      color: var(--bs-secondary-color);
      border-left: 3px solid var(--card-border);
      padding: .1rem 0 .1rem .75rem;
    }
    .tmpl-textblock a { color: var(--bs-info); }

    /* Repeatable instances */
    .repeat-item {
      display: flex;
      align-items: flex-start;
      gap: .4rem;
      margin-bottom: .4rem;
    }
    .repeat-item > :first-child { flex: 1; min-width: 0; }
    .repeat-remove {
      color: var(--placeholder);
      padding: .2rem .4rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .repeat-remove:hover { color: var(--bs-danger); }

    .attr-instance { width: 100%; }

    /* object_field instances */
    .object-name {
      font-size: .75rem;
      color: var(--bs-secondary-color);
    }
    .object-name code {
      background: var(--hover-bg);
      padding: .05rem .3rem;
      border-radius: .2rem;
    }
    .object-instance {
      border: 1px solid var(--card-border);
      border-radius: .4rem;
      padding: .7rem .8rem;
      background: rgba(255,255,255,.02);
    }
    .repeat-item > .object-instance { flex: 1; }

    /* tag_field / galaxy_field token picker */
    .token-picker { position: relative; }
    .token-chips {
      display: none;
      flex-wrap: wrap;
      gap: .3rem;
      margin-bottom: .35rem;
    }
    .token-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .78rem;
      padding: .12rem .3rem .12rem .55rem;
      border-radius: 1rem;
      background: rgba(var(--bs-info-rgb), .15);
      border: 1px solid rgba(var(--bs-info-rgb), .35);
      color: var(--app-fg);
    }
    .token-chip-x {
      background: none;
      border: none;
      color: var(--placeholder);
      padding: 0 .1rem;
      cursor: pointer;
      line-height: 1;
      font-size: .7rem;
    }
    .token-chip-x:hover { color: var(--bs-danger); }

    .token-inputbox { position: relative; }
    .token-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: .375rem;
      padding: .35rem .6rem;
      font-size: .85rem;
      color: var(--app-fg);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .token-input::placeholder { color: var(--placeholder); }
    .token-input:focus {
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 .2rem rgba(var(--bs-primary-rgb), .15);
    }

    .token-dropdown {
      position: absolute;
      top: calc(100% + 3px);
      left: 0;
      right: 0;
      z-index: 400;
      background: var(--sidebar-bg);
      border: 1px solid var(--card-border);
      border-radius: .4rem;
      box-shadow: 0 6px 24px rgba(0,0,0,.4);
      max-height: 260px;
      overflow-y: auto;
      padding: .25rem 0;
    }
    .token-option {
      padding: .35rem .7rem;
      cursor: pointer;
      transition: background .08s;
    }
    .token-option:hover,
    .token-option.token-focused { background: var(--hover-bg); }
    .token-opt-label {
      font-size: .82rem;
      color: var(--app-fg);
      font-family: 'Courier New', Courier, monospace;
    }
    .token-opt-sub {
      font-size: .72rem;
      color: var(--bs-secondary-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .token-empty {
      padding: .55rem .7rem;
      font-size: .8rem;
      color: var(--placeholder);
      text-align: center;
    }

    /* file_field */
    .file-intent {
      font-size: .75rem;
      color: var(--bs-secondary-color);
    }
    .file-intent code {
      background: var(--hover-bg);
      padding: .05rem .3rem;
      border-radius: .2rem;
    }
    .file-info {
      font-size: .74rem;
      color: var(--bs-secondary-color);
      margin-top: .25rem;
      min-height: 1rem;
    }
  </style>
</head>
<body data-page="template">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-8 col-md-7 col-sm-12">
        <div id="menu-container"></div>

        <div class="p-3">

          <!-- Page header -->
          <div class="mb-4">
            <div class="d-flex align-items-center gap-2 mb-1">
              <i class="fa-solid fa-wand-magic-sparkles fa-lg text-info" style="width:1.5rem;text-align:center"></i>
              <h2 class="mb-0 h3">Report via Template</h2>
            </div>
            <p class="text-secondary mb-0" style="padding-left:2.1rem;font-size:.875rem">
              Pick a guided template curated by the receiving team, fill in the fields with the
              provided explanations, and submit — a structured MISP event is created for you.
            </p>
          </div>

          <!-- Template selector card -->
          <div class="card card-dark mb-3">
            <div class="card-body">
              <label for="template-select" class="form-label fw-semibold mb-2" style="font-size:.875rem">
                Select template
              </label>
              <div class="tmpl-combobox" id="tmpl-combobox">
                <div class="tmpl-combobox-wrap">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input
                    type="text"
                    id="template-select"
                    placeholder="Type to search templates…"
                    autocomplete="off"
                    spellcheck="false"
                  />
                  <button class="tmpl-clear" id="tmpl-clear" tabindex="-1" aria-label="Clear">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="tmpl-dropdown" id="tmpl-dropdown">
                  <div class="tmpl-list" id="tmpl-list"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Template info banner (populated by JS) -->
          <div id="template-header"></div>

          <!-- Event-level defaults panel (populated by JS, C7) -->
          <div id="template-defaults"></div>

          <!-- Slim metadata block (populated by JS, C8) -->
          <div id="template-metadata"></div>

          <!-- Dynamic form (populated by JS) -->
          <div class="card card-dark">
            <div class="card-body" id="template-form">
              <p class="text-secondary mb-0" style="font-size:.875rem">
                <i class="fa-solid fa-arrow-up me-1"></i>Choose a template above to reveal the form.
              </p>
            </div>
          </div>

        </div>
      </div>

      <div class="col-lg-4 col-md-5 col-sm-12" id="tokenstore-container"></div>
    </div>
  </div>

  <script>
/* ================================================================
   Report via Template — page logic
   Renders a guided form from an event-template definition and
   submits it to POST /share/template. Backend contracts:
     GET  /templates                 → [{uuid,name,description,tags}]
     GET  /templates/{uuid}          → full event-template-v1 definition
     GET  /object_templates?template → MISP object template (object_field)
     GET  /taxonomies?ns=            → {entries:[{tag,…}]}  (tag_field)
     GET  /galaxy_clusters?type=&q=  → {results:[{value,tag,…}]} (galaxy_field)
     POST /share/template            → {token, event_uuid, status:"ok"}
   ================================================================ */

  // ── Module state (reset on every template load) ────────────────
  let currentDefinition = null;

  function apiBase() { return baseUrl || window.location.origin; }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // Widgets register a value gatherer here; the submit step (C9) walks it to
  // build the `values` payload. Live listeners (info preview C7, validation C9)
  // are notified whenever a field changes. Both are reset per template load.
  let fieldWidgets = [];          // [{id, type, mandatory, el, gather}]
  let fieldChangeListeners = [];  // [fn]

  function notifyFieldChange() {
    fieldChangeListeners.forEach(fn => { try { fn(); } catch (_) {} });
  }

  // ── Safe Markdown (help text, text_block, event_report bodies) ─
  // Escapes first, then applies a small inline subset. No raw HTML passes
  // through and link hrefs are scheme-checked (S5): only http/https/mailto.
  function safeMarkdown(src) {
    if (typeof src !== 'string' || src === '') return '';
    let s = escHtml(src);
    s = s.replace(/`([^`]+)`/g, (_m, c) => `<code>${c}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, (_m, c) => `<strong>${c}</strong>`);
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, (_m, pre, c) => `${pre}<em>${c}</em>`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, text, url) => {
      if (/^(https?:|mailto:)/i.test(url)) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      }
      return `${text} (${url})`;
    });
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  // Build a labelled field group: `.mb-3` with a label (+ mandatory asterisk)
  // and optional safe-Markdown help. Returns the group and its body slot.
  function buildFieldGroup(el, { labelText, helpText } = {}) {
    const group = document.createElement('div');
    group.className = 'mb-3';

    const label = document.createElement('label');
    label.className = 'form-label mb-1';
    label.textContent = labelText != null ? labelText : (el.label || el.id || '');
    if (el.mandatory) {
      const star = document.createElement('span');
      star.className = 'text-danger';
      star.textContent = ' *';
      label.appendChild(star);
    }
    group.appendChild(label);

    const help = helpText != null ? helpText : el.help;
    if (help) {
      const small = document.createElement('small');
      small.className = 'form-text text-muted d-block mb-1';
      small.innerHTML = safeMarkdown(help);
      group.appendChild(small);
    }
    return { group, label };
  }

  // Reusable repeater: seeds one instance, offers "Add …", and per-instance
  // remove (hidden while a single instance remains). `makeItem()` returns
  // `{node, gather}`; `gatherAll()` returns the non-empty instance values.
  function repeatableGroup(makeItem, { itemLabel = 'another' } = {}) {
    const container = document.createElement('div');
    const list = document.createElement('div');
    container.appendChild(list);
    const items = [];   // [{row, gather}]

    function updateRemoveVisibility() {
      items.forEach(it => {
        const btn = it.row.querySelector('.repeat-remove');
        if (btn) btn.style.display = items.length > 1 ? '' : 'none';
      });
    }
    function addInstance() {
      const { node, gather } = makeItem();
      const row = document.createElement('div');
      row.className = 'repeat-item';
      row.appendChild(node);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'btn btn-sm repeat-remove';
      rm.title = 'Remove';
      rm.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      rm.addEventListener('click', () => {
        const idx = items.findIndex(it => it.row === row);
        if (idx >= 0) items.splice(idx, 1);
        row.remove();
        updateRemoveVisibility();
        notifyFieldChange();
      });
      row.appendChild(rm);
      list.appendChild(row);
      items.push({ row, gather });
      updateRemoveVisibility();
    }

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn btn-sm btn-outline-secondary mt-1';
    addBtn.innerHTML = `<i class="fa-solid fa-plus me-1"></i>Add ${itemLabel}`;
    addBtn.addEventListener('click', () => { addInstance(); notifyFieldChange(); });
    container.appendChild(addBtn);

    addInstance();   // seed one

    return {
      node: container,
      gatherAll() {
        const out = [];
        for (const it of items) {
          const v = it.gather();
          if (v === undefined || v === null || v === '') continue;
          if (Array.isArray(v) && v.length === 0) continue;
          out.push(v);
        }
        return out;
      }
    };
  }

  // ── Template picker ────────────────────────────────────────────
  // Lists GET /templates ({uuid,name,description,tags}); filters across
  // name + description + tags; on select, fetches the full definition.
  async function loadTemplateList() {
    let templates = [];
    try {
      const res = await fetch(`${apiBase()}/templates`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      templates = await res.json();
      if (!Array.isArray(templates)) templates = [];
    } catch (err) {
      console.error('Error loading templates:', err);
      showToast('Could not load the template list.', false);
    }

    const input    = document.getElementById('template-select');
    const dropdown = document.getElementById('tmpl-dropdown');
    const listEl   = document.getElementById('tmpl-list');
    const clearBtn = document.getElementById('tmpl-clear');
    let focusIdx   = -1;

    function haystack(t) {
      return [t.name, t.description, ...(t.tags || [])]
        .filter(Boolean).join(' ').toLowerCase();
    }

    function highlightMatch(text, query) {
      text = text || '';
      if (!query) return escHtml(text);
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escHtml(text);
      return escHtml(text.slice(0, idx))
        + '<mark>' + escHtml(text.slice(idx, idx + query.length)) + '</mark>'
        + escHtml(text.slice(idx + query.length));
    }

    function renderList(query) {
      const q        = (query || '').toLowerCase();
      const filtered = q ? templates.filter(t => haystack(t).includes(q)) : templates;
      focusIdx       = -1;
      listEl.innerHTML = '';

      if (!filtered.length) {
        const msg = document.createElement('div');
        msg.className   = 'tmpl-empty';
        msg.textContent = templates.length ? 'No matching templates' : 'No templates available';
        listEl.appendChild(msg);
        return;
      }

      filtered.forEach(t => {
        const item = document.createElement('div');
        item.className    = 'tmpl-item';
        item.dataset.uuid = t.uuid;
        item.dataset.name = t.name || '';
        let html = `<div class="tmpl-item-name">${highlightMatch(t.name, query)}</div>`;
        if (t.description) html += `<div class="tmpl-item-desc">${highlightMatch(t.description, query)}</div>`;
        item.innerHTML = html;
        item.addEventListener('mousedown', e => {
          e.preventDefault();               // keep focus on input
          selectTemplate(t);
        });
        listEl.appendChild(item);
      });
    }

    function openDropdown() {
      renderList(input.value.trim());
      dropdown.style.display = 'block';
    }
    function closeDropdown() {
      dropdown.style.display = 'none';
      focusIdx = -1;
    }

    function selectTemplate(t) {
      input.value            = t.name || '';
      clearBtn.style.display = 'block';
      closeDropdown();
      loadTemplateDefinition(t.uuid);
    }

    function moveFocus(delta) {
      const items = listEl.querySelectorAll('.tmpl-item');
      if (!items.length) return;
      items[focusIdx]?.classList.remove('tmpl-focused');
      focusIdx = Math.max(0, Math.min(items.length - 1, focusIdx + delta));
      items[focusIdx].classList.add('tmpl-focused');
      items[focusIdx].scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('focus', openDropdown);
    input.addEventListener('input', () => {
      clearBtn.style.display = input.value.trim() ? 'block' : 'none';
      openDropdown();
    });
    input.addEventListener('keydown', e => {
      if (dropdown.style.display === 'none') { openDropdown(); return; }
      if      (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(+1); }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); moveFocus(-1); }
      else if (e.key === 'Escape')    { closeDropdown(); input.blur(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const items   = listEl.querySelectorAll('.tmpl-item');
        const focused = items[focusIdx];
        if (focused) {
          selectTemplate({ uuid: focused.dataset.uuid, name: focused.dataset.name });
        } else {
          const match = templates.find(t => (t.name || '').toLowerCase() === input.value.trim().toLowerCase());
          if (match) selectTemplate(match);
        }
      }
    });
    input.addEventListener('blur', () => setTimeout(closeDropdown, 150));
    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.style.display = 'none';
      input.focus();
    });
    document.addEventListener('click', e => {
      if (!document.getElementById('tmpl-combobox').contains(e.target)) closeDropdown();
    });
  }

  // Fetch a full definition by uuid and render its form.
  async function loadTemplateDefinition(uuid) {
    try {
      const res = await fetch(`${apiBase()}/templates/${encodeURIComponent(uuid)}`);
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { detail = (await res.json()).detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      const definition = await res.json();
      renderDefinition(definition);
    } catch (err) {
      console.error('Error loading template definition:', err);
      showToast(`Could not load template: ${err.message}`, false);
    }
  }

  // ── Element renderers ──────────────────────────────────────────
  // Dispatch: build the header banner, then render the structure into
  // section cards. Interactive element widgets are filled in C3–C6.
  function renderDefinition(definition) {
    currentDefinition = definition;
    fieldWidgets = [];
    fieldChangeListeners = [];

    // Header banner: name + description + library tags.
    const headerEl = document.getElementById('template-header');
    headerEl.innerHTML = '';
    const h3 = document.createElement('h3');
    h3.textContent = definition.name || 'Untitled template';
    headerEl.appendChild(h3);
    if (definition.description) {
      const p = document.createElement('p');
      p.textContent = definition.description;
      headerEl.appendChild(p);
    }
    const tags = (definition.library_metadata && definition.library_metadata.tags) || [];
    tags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'tmpl-tag';
      span.textContent = tag;
      headerEl.appendChild(span);
    });

    // Form container: rebuild from scratch.
    const container = document.getElementById('template-form');
    container.innerHTML = '';
    const form = document.createElement('form');
    form.id = 'report-form';
    form.noValidate = true;

    // Section grouping: sections are top-level cards; every other element
    // renders into its parent section's body (or the root when parentless).
    const structure = Array.isArray(definition.structure) ? definition.structure : [];
    const sectionBodies = {};   // section id → DOM container to append children into

    for (const el of structure) {
      if (!el || typeof el !== 'object') continue;
      if (el.type === 'section') {
        const { card, body } = renderSection(el);
        sectionBodies[el.id] = body;
        form.appendChild(card);
        continue;
      }
      const node = renderElement(el);
      if (!node) continue;
      const parent = el.parent && sectionBodies[el.parent] ? sectionBodies[el.parent] : form;
      parent.appendChild(node);
    }

    // Submit button.
    const submitBtn = document.createElement('button');
    submitBtn.type = 'submit';
    submitBtn.className = 'btn btn-primary btn-sm';
    submitBtn.id = 'template-submit';
    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>Submit';
    form.appendChild(submitBtn);

    form.onsubmit = e => { e.preventDefault(); /* submit wired in C9 */ };

    container.appendChild(form);
  }

  // A section becomes a titled card; children are appended to its body.
  function renderSection(el) {
    const card = document.createElement('div');
    card.className = 'card card-dark mb-3';
    const body = document.createElement('div');
    body.className = 'card-body';
    if (el.label) {
      const h = document.createElement('h5');
      h.className = 'card-title h6 fw-semibold mb-1';
      h.textContent = el.label;
      body.appendChild(h);
    }
    card.appendChild(body);
    return { card, body };
  }

  // Render a single interactive element. Per-type cases are added in
  // C3–C6; unknown/not-yet-supported types fall through to a defensive note.
  function renderElement(el) {
    switch (el.type) {
      case 'text_block':      return renderTextBlock(el);
      case 'attribute_field': return renderAttributeField(el);
      case 'object_field':    return renderObjectField(el);
      case 'tag_field':       return renderTagField(el);
      case 'galaxy_field':    return renderGalaxyField(el);
      case 'file_field':      return renderFileField(el);
      case 'event_report':    return renderEventReport(el);
      case 'object_reference': return null;   // materialised server-side (no UI)
      default: {
        const note = document.createElement('div');
        note.className = 'mb-3 text-secondary';
        note.style.fontSize = '.8rem';
        note.textContent = `[${el.type}] ${el.label || el.id || ''}`;
        return note;
      }
    }
  }

  // text_block → safe-Markdown prose, no input, no data.
  function renderTextBlock(el) {
    const block = document.createElement('div');
    block.className = 'tmpl-textblock mb-3';
    block.innerHTML = safeMarkdown(el.content || '');
    return block;
  }

  // attribute_field → text input(s). `default_value` prefills; `repeatable`
  // adds Add/remove instances. Gathers `str` (single) or `list[str]` (repeatable).
  // A per-instance `.attr-tag-hook` slot is left for a future tag picker (D3).
  function renderAttributeField(el) {
    const misp = el.misp || {};
    const { group } = buildFieldGroup(el);

    function makeInstance(prefill) {
      const wrap = document.createElement('div');
      wrap.className = 'attr-instance';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'form-control form-control-sm';
      input.placeholder = `${misp.type || ''}${misp.category ? ' · ' + misp.category : ''}`.trim();
      if (prefill) input.value = prefill;
      input.addEventListener('input', notifyFieldChange);
      wrap.appendChild(input);
      // Future per-attribute tag picker slots in here without restructuring.
      const hook = document.createElement('div');
      hook.className = 'attr-tag-hook';
      hook.dataset.attrHook = '1';
      wrap.appendChild(hook);
      return { node: wrap, input };
    }

    let gather;
    if (el.repeatable) {
      const rg = repeatableGroup(() => {
        const inst = makeInstance(misp.default_value);
        return { node: inst.node, gather: () => inst.input.value.trim() || undefined };
      }, { itemLabel: 'value' });
      group.appendChild(rg.node);
      gather = () => { const vals = rg.gatherAll(); return vals.length ? vals : undefined; };
    } else {
      const inst = makeInstance(misp.default_value);
      group.appendChild(inst.node);
      gather = () => inst.input.value.trim() || undefined;
    }

    fieldWidgets.push({ id: el.id, type: 'attribute_field', mandatory: !!el.mandatory, el, gather });
    return group;
  }

  // Resolve the visible relations for an object_field: the author's `relations`
  // (honouring label_override/help_override/mandatory/default_value, skipping
  // hidden) when present, else the object template's own attributes by
  // ui-priority. Hidden relations aren't rendered — their default_value is
  // applied server-side regardless.
  function resolveRelations(el, objDef) {
    const attrs = (objDef && objDef.attributes) || {};
    const authored = Array.isArray(el.relations) ? el.relations : [];
    if (authored.length) {
      return authored.filter(r => r && r.object_relation && !r.hidden).map(r => {
        const meta = attrs[r.object_relation] || {};
        return {
          relation: r.object_relation,
          labelText: r.label_override || r.object_relation,
          helpText: r.help_override || meta.description || null,
          mandatory: !!r.mandatory,
          defaultValue: r.default_value != null ? r.default_value : null,
          meta,
        };
      });
    }
    const required = (objDef && objDef.required) || [];
    return Object.entries(attrs)
      .sort((a, b) => (b[1]['ui-priority'] || 0) - (a[1]['ui-priority'] || 0))
      .map(([rel, meta]) => ({
        relation: rel,
        labelText: rel,
        helpText: meta.description || null,
        mandatory: required.includes(rel),
        defaultValue: null,
        meta,
      }));
  }

  // Build one relation control: label (+ mandatory marker) + Markdown help +
  // a <select> when the object template constrains values, else a text input.
  function buildRelationControl(r) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-2';

    const label = document.createElement('label');
    label.className = 'form-label mb-1';
    label.textContent = r.labelText;
    if (r.mandatory) {
      const star = document.createElement('span');
      star.className = 'text-danger';
      star.textContent = ' *';
      label.appendChild(star);
    }
    wrap.appendChild(label);
    if (r.helpText) {
      const small = document.createElement('small');
      small.className = 'form-text text-muted d-block mb-1';
      small.innerHTML = safeMarkdown(r.helpText);
      wrap.appendChild(small);
    }

    const options = Array.isArray(r.meta.values_list) && r.meta.values_list.length
      ? r.meta.values_list : null;
    let control;
    if (options) {
      control = document.createElement('select');
      control.className = 'form-select form-select-sm';
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = '—';
      control.appendChild(blank);
      options.forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = v;
        control.appendChild(o);
      });
      if (r.defaultValue != null) control.value = r.defaultValue;
    } else {
      control = document.createElement('input');
      control.type = 'text';
      control.className = 'form-control form-control-sm';
      control.placeholder = r.meta['misp-attribute'] || '';
      if (r.defaultValue != null) control.value = r.defaultValue;
    }
    control.addEventListener('input', notifyFieldChange);
    control.addEventListener('change', notifyFieldChange);
    wrap.appendChild(control);
    return { node: wrap, getValue: () => (control.value || '').trim() };
  }

  // object_field → a MISP object built from the chosen object template. Fetches
  // the template (async) then renders its relations; repeatable object_fields
  // add whole object instances. Gathers `{relation: value}` or a list of them.
  function renderObjectField(el) {
    const { group } = buildFieldGroup(el);
    const objName = (el.object_template || {}).name || '';

    const badge = document.createElement('div');
    badge.className = 'object-name mb-2';
    badge.innerHTML = `<i class="fa-solid fa-cube me-1"></i>MISP object: <code>${escHtml(objName)}</code>`;
    group.appendChild(badge);

    const host = document.createElement('div');
    const loading = document.createElement('div');
    loading.className = 'text-secondary';
    loading.style.fontSize = '.8rem';
    loading.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Loading object template…';
    host.appendChild(loading);
    group.appendChild(host);

    let gatherFn = () => undefined;   // until the template loads
    fieldWidgets.push({ id: el.id, type: 'object_field', mandatory: !!el.mandatory, el, gather: () => gatherFn() });

    (async () => {
      let objDef = null;
      try {
        const res = await fetch(`${apiBase()}/object_templates?template=${encodeURIComponent(objName)}`);
        if (res.ok) objDef = await res.json();
        else console.warn(`object template "${objName}" fetch failed: HTTP ${res.status}`);
      } catch (err) {
        console.warn(`object template "${objName}" fetch error:`, err);
      }
      loading.remove();
      const relations = resolveRelations(el, objDef || {});
      if (!relations.length) {
        const warn = document.createElement('div');
        warn.className = 'text-warning';
        warn.style.fontSize = '.8rem';
        warn.textContent = 'No relations available for this object.';
        host.appendChild(warn);
        return;
      }

      const makeInstance = () => {
        const card = document.createElement('div');
        card.className = 'object-instance';
        const controls = [];
        relations.forEach(r => {
          const rc = buildRelationControl(r);
          card.appendChild(rc.node);
          controls.push({ relation: r.relation, getValue: rc.getValue });
        });
        const gather = () => {
          const map = {};
          controls.forEach(c => { const v = c.getValue(); if (v) map[c.relation] = v; });
          return Object.keys(map).length ? map : undefined;
        };
        return { node: card, gather };
      };

      if (el.repeatable) {
        const rg = repeatableGroup(makeInstance, { itemLabel: 'instance' });
        host.appendChild(rg.node);
        gatherFn = () => { const arr = rg.gatherAll(); return arr.length ? arr : undefined; };
      } else {
        const inst = makeInstance();
        host.appendChild(inst.node);
        gatherFn = () => inst.gather();
      }
      notifyFieldChange();
    })();

    return group;
  }

  // Reusable chips + searchable-dropdown picker shared by tag_field and
  // galaxy_field. `provider(query)` resolves to `[{value, label, sublabel}]`
  // (a static filter for tags, an async typeahead for galaxies). Single-select
  // replaces; multi-select accumulates chips. getValues() returns the emitted
  // value strings (machine tag for tags, cluster value for galaxies).
  function tokenPicker({ provider, multiple, placeholder }) {
    const wrap = document.createElement('div');
    wrap.className = 'token-picker';

    const chips = document.createElement('div');
    chips.className = 'token-chips';
    wrap.appendChild(chips);

    const box = document.createElement('div');
    box.className = 'token-inputbox';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'token-input';
    input.placeholder = placeholder || 'Type to search…';
    input.autocomplete = 'off';
    input.spellcheck = false;
    box.appendChild(input);
    const drop = document.createElement('div');
    drop.className = 'token-dropdown';
    drop.style.display = 'none';
    box.appendChild(drop);
    wrap.appendChild(box);

    const selected = [];   // {value, label}
    let currentOpts = [];
    let focusIdx = -1;

    function renderChips() {
      chips.innerHTML = '';
      chips.style.display = selected.length ? 'flex' : 'none';
      selected.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'token-chip';
        const txt = document.createElement('span');
        txt.textContent = s.label;
        chip.appendChild(txt);
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'token-chip-x';
        x.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        x.addEventListener('click', () => {
          const i = selected.indexOf(s);
          if (i >= 0) selected.splice(i, 1);
          renderChips();
          notifyFieldChange();
        });
        chip.appendChild(x);
        chips.appendChild(chip);
      });
    }

    function addSelection(opt) {
      if (!multiple) selected.length = 0;
      if (!selected.some(s => s.value === opt.value)) selected.push({ value: opt.value, label: opt.label });
      renderChips();
      input.value = '';
      closeDrop();
      notifyFieldChange();
      if (!multiple) input.blur();
    }

    function highlight() {
      const opts = drop.querySelectorAll('.token-option');
      opts.forEach((o, i) => o.classList.toggle('token-focused', i === focusIdx));
      if (opts[focusIdx]) opts[focusIdx].scrollIntoView({ block: 'nearest' });
    }

    function renderDrop() {
      drop.innerHTML = '';
      if (!currentOpts.length) {
        const e = document.createElement('div');
        e.className = 'token-empty';
        e.textContent = 'No matches';
        drop.appendChild(e);
      } else {
        currentOpts.forEach(o => {
          const it = document.createElement('div');
          it.className = 'token-option';
          let html = `<div class="token-opt-label">${escHtml(o.label)}</div>`;
          if (o.sublabel) html += `<div class="token-opt-sub">${escHtml(o.sublabel)}</div>`;
          it.innerHTML = html;
          it.addEventListener('mousedown', e => { e.preventDefault(); addSelection(o); });
          drop.appendChild(it);
        });
      }
      drop.style.display = 'block';
    }
    function closeDrop() { drop.style.display = 'none'; focusIdx = -1; }

    async function refresh() {
      const q = input.value.trim();
      let opts = [];
      try { opts = await provider(q); } catch (_) { opts = []; }
      currentOpts = opts.filter(o => !selected.some(s => s.value === o.value)).slice(0, 50);
      focusIdx = -1;
      renderDrop();
    }

    let deb;
    input.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(refresh, 180); });
    input.addEventListener('focus', refresh);
    input.addEventListener('blur', () => setTimeout(closeDrop, 150));
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (drop.style.display === 'none') { refresh(); return; }
        focusIdx = Math.min(currentOpts.length - 1, focusIdx + 1); highlight();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusIdx = Math.max(0, focusIdx - 1); highlight();
      } else if (e.key === 'Enter') {
        if (focusIdx >= 0 && currentOpts[focusIdx]) { e.preventDefault(); addSelection(currentOpts[focusIdx]); }
      } else if (e.key === 'Escape') {
        closeDrop();
      } else if (e.key === 'Backspace' && !input.value && selected.length) {
        selected.pop(); renderChips(); notifyFieldChange();
      }
    });

    renderChips();
    return { node: wrap, getValues: () => selected.map(s => s.value) };
  }

  // tag_field → taxonomy machine tags from bundled misp-taxonomies. Entries for
  // every restrict_taxonomies namespace are lazy-loaded once, then filtered
  // client-side. Emits the full machine tag (e.g. `tlp:amber`).
  function renderTagField(el) {
    const { group } = buildFieldGroup(el);
    const namespaces = Array.isArray(el.restrict_taxonomies) ? el.restrict_taxonomies : [];
    let entries = null;

    async function loadEntries() {
      if (entries) return entries;
      entries = [];
      for (const ns of namespaces) {
        try {
          const res = await fetch(`${apiBase()}/taxonomies?ns=${encodeURIComponent(ns)}`);
          if (res.ok) {
            const d = await res.json();
            (d.entries || []).forEach(e => entries.push(e));
          }
        } catch (err) {
          console.warn(`taxonomy "${ns}" fetch error:`, err);
        }
      }
      return entries;
    }

    const provider = async (q) => {
      const all = await loadEntries();
      const ql = q.toLowerCase();
      const filtered = ql
        ? all.filter(e => (e.tag || '').toLowerCase().includes(ql) || (e.label || '').toLowerCase().includes(ql))
        : all;
      return filtered.map(e => ({
        value: e.tag,
        label: e.tag,
        sublabel: e.label && e.label !== e.tag ? e.label : (e.description || ''),
      }));
    };

    const picker = tokenPicker({
      provider,
      multiple: !!el.multiple,
      placeholder: namespaces.length ? `Search ${namespaces.join(', ')} tags…` : 'Search tags…',
    });
    group.appendChild(picker.node);

    const gather = () => {
      const vals = picker.getValues();
      if (!vals.length) return undefined;
      return el.multiple ? vals : vals[0];
    };
    fieldWidgets.push({ id: el.id, type: 'tag_field', mandatory: !!el.mandatory, el, gather });
    return group;
  }

  // galaxy_field → typeahead over bundled misp-galaxy clusters for the declared
  // restrict_galaxy_types. Emits the cluster *value* string (e.g. `APT28`),
  // which the backend resolves to its misp-galaxy tag.
  function renderGalaxyField(el) {
    const { group } = buildFieldGroup(el);
    const types = Array.isArray(el.restrict_galaxy_types) ? el.restrict_galaxy_types : [];

    const provider = async (q) => {
      const seen = new Set();
      const out = [];
      for (const t of types) {
        try {
          const res = await fetch(`${apiBase()}/galaxy_clusters?type=${encodeURIComponent(t)}&q=${encodeURIComponent(q)}&limit=20`);
          if (res.ok) {
            const d = await res.json();
            (d.results || []).forEach(c => {
              if (seen.has(c.value)) return;
              seen.add(c.value);
              out.push({ value: c.value, label: c.value, sublabel: (c.description || '').slice(0, 120) });
            });
          }
        } catch (err) {
          console.warn(`galaxy "${t}" fetch error:`, err);
        }
      }
      return out;
    };

    const picker = tokenPicker({
      provider,
      multiple: !!el.multiple,
      placeholder: types.length ? `Search ${types.join(', ')}…` : 'Search clusters…',
    });
    group.appendChild(picker.node);

    const gather = () => {
      const vals = picker.getValues();
      if (!vals.length) return undefined;
      return el.multiple ? vals : vals[0];
    };
    fieldWidgets.push({ id: el.id, type: 'galaxy_field', mandatory: !!el.mandatory, el, gather });
    return group;
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  const MAX_FILE_BYTES = 50 * 1024 * 1024;   // mirror the backend 50 MB body limit (S6)

  // file_field → base64-encoded {filename, data}. The `as` intent is the
  // author's; malware-sample encryption happens server-side on push, so the
  // client only needs raw base64. Repeatable adds more files.
  function renderFileField(el) {
    const asKind = el.as === 'malware-sample' ? 'malware-sample' : 'attachment';
    const { group } = buildFieldGroup(el);

    const badge = document.createElement('div');
    badge.className = 'file-intent mb-2';
    badge.innerHTML = asKind === 'malware-sample'
      ? '<i class="fa-solid fa-biohazard me-1"></i>Stored as <code>malware-sample</code> — encrypted server-side (password <code>infected</code>)'
      : '<i class="fa-solid fa-paperclip me-1"></i>Stored as <code>attachment</code>';
    group.appendChild(badge);

    function makeInstance() {
      const wrap = document.createElement('div');
      wrap.className = 'file-instance';
      let stored = null;   // {filename, data}
      const input = document.createElement('input');
      input.type = 'file';
      input.className = 'form-control form-control-sm';
      const info = document.createElement('div');
      info.className = 'file-info';
      input.addEventListener('change', () => {
        const f = input.files && input.files[0];
        if (!f) { stored = null; info.textContent = ''; notifyFieldChange(); return; }
        if (f.size > MAX_FILE_BYTES) {
          stored = null; input.value = '';
          info.textContent = `${f.name} is too large (max ${formatBytes(MAX_FILE_BYTES)}).`;
          info.classList.add('text-danger');
          showToast(`"${f.name}" exceeds the ${formatBytes(MAX_FILE_BYTES)} limit.`, false);
          notifyFieldChange();
          return;
        }
        info.classList.remove('text-danger');
        const reader = new FileReader();
        reader.onload = () => {
          const res = String(reader.result || '');
          const comma = res.indexOf(',');
          stored = { filename: f.name, data: comma >= 0 ? res.slice(comma + 1) : res };
          info.textContent = `${f.name} · ${formatBytes(f.size)}`;
          notifyFieldChange();
        };
        reader.onerror = () => {
          stored = null; info.textContent = 'Could not read the file.';
          info.classList.add('text-danger'); notifyFieldChange();
        };
        reader.readAsDataURL(f);
      });
      wrap.appendChild(input);
      wrap.appendChild(info);
      return { node: wrap, gather: () => stored || undefined };
    }

    let gather;
    if (el.repeatable) {
      const rg = repeatableGroup(makeInstance, { itemLabel: 'file' });
      group.appendChild(rg.node);
      gather = () => { const arr = rg.gatherAll(); return arr.length ? arr : undefined; };
    } else {
      const inst = makeInstance();
      group.appendChild(inst.node);
      gather = () => inst.gather();
    }

    fieldWidgets.push({ id: el.id, type: 'file_field', mandatory: !!el.mandatory, el, gather });
    return group;
  }

  // event_report → a Markdown body seeded with default_content. Emits the
  // trimmed string (an EventReport row is created server-side).
  function renderEventReport(el) {
    const { group } = buildFieldGroup(el);

    const ta = document.createElement('textarea');
    ta.className = 'form-control form-control-sm';
    ta.rows = 6;
    ta.placeholder = 'Write in Markdown…';
    if (el.default_content != null) ta.value = el.default_content;
    ta.addEventListener('input', notifyFieldChange);
    group.appendChild(ta);

    const hint = document.createElement('small');
    hint.className = 'form-text text-muted d-block mt-1';
    hint.innerHTML = '<i class="fa-brands fa-markdown me-1"></i>Markdown supported.';
    group.appendChild(hint);

    const gather = () => { const v = ta.value.trim(); return v || undefined; };
    fieldWidgets.push({ id: el.id, type: 'event_report', mandatory: !!el.mandatory, el, gather });
    return group;
  }

  // ── Event-level defaults + live info preview ───────────────────
  // (C7)

  // ── Slim metadata (PAP / submitter / description) ──────────────
  // (C8)

  // ── Submit + validation ────────────────────────────────────────
  // (C9)

  // ── Init ───────────────────────────────────────────────────────
  async function initTemplatePage() {
    if (typeof loadConfig === 'function' && !baseUrl) await loadConfig();
    await loadTemplateList();
  }

  window.addEventListener('load', () => { initTemplatePage(); });
  </script>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
